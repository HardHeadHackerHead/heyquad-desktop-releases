# Approval gate for a Hey Quad desktop release.
#
# The build pipeline (private repo) uploads a DRAFT release here and then
# dispatches this workflow. The job below is bound to the `desktop-release`
# environment, whose required reviewer must approve it in the Actions tab.
# Until then the draft is invisible to the public and to installed apps
# (the updater reads releases/latest, which skips drafts).
#
# On approval it checks the draft is complete and publishes it as the
# latest release; installed apps pick it up on their next update check.
# Reject the run (or delete the draft) to stop a release.
name: Publish desktop release
run-name: Publish ${{ github.event.client_payload.tag || inputs.tag }}

on:
  repository_dispatch:
    types: [desktop-release-candidate]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to publish (desktop-vX.Y.Z)
        required: true

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: desktop-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.event.client_payload.tag || inputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Check the draft
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag: $TAG"; exit 1; }
          gh release view "$TAG" --json isDraft,assets > release.json
          jq -e '.isDraft' release.json > /dev/null || { echo "$TAG is already published"; exit 1; }
          gh release download "$TAG" --pattern latest.json --dir .
          version="${TAG#desktop-v}"
          jq -e --arg v "$version" '.version == $v' latest.json > /dev/null \
            || { echo "latest.json is not version $version"; exit 1; }
          jq -e '.platforms | has("windows-x86_64")' latest.json > /dev/null \
            || { echo "latest.json has no Windows build"; exit 1; }
          # Every installer latest.json points at must be on this release.
          for url in $(jq -r '.platforms[].url' latest.json | sort -u); do
            name="${url##*/}"
            [[ "$url" == "https://github.com/$GH_REPO/releases/download/$TAG/$name" ]] \
              || { echo "unexpected URL $url"; exit 1; }
            jq -e --arg n "$name" '.assets | map(.name) | index($n)' release.json > /dev/null \
              || { echo "missing asset $name"; exit 1; }
          done
          echo "Draft $TAG is complete:"
          jq -r '.assets[].name' release.json

      - name: Publish
        run: gh release edit "$TAG" --draft=false --latest
